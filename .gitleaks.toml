# Continuous Security Demo — production Gitleaks config.
#
# Extends the bundled default rules. Allows the six documented LocalOnly demo
# passwords only at their seed/test/docs paths, and excludes only the synthetic
# fixtures used by deterministic tests.
#
# No broad password, JWT, SUPABASE_*, or repository-wide allowlist exists here.

title = "continuous-security-demo production"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic secrets in deterministic test fixtures (Task 5)."
paths = [
  '''security/fixtures/''',
]

[[allowlists]]
description = "Documented LocalOnly-* demo passwords at exact seed/test paths."
condition = "AND"
paths = [
  '''(supabase/seed\.sql|apps/api/test/helpers/seed-identities\.ts)''',
]
regexes = [
  '''(LocalOnly-Admin1!|LocalOnly-Manager1!|LocalOnly-UserA1!|LocalOnly-UserB1!|LocalOnly-Suspended1!|LocalOnly-Admin2!)''',
]

[[allowlists]]
description = "Documentation prose in the Project 2 plan file that triggers the generic-api-key rule; never a real secret."
paths = [
  '''docs/superpowers/plans/2026-08-29-project-2-deterministic-pr-security\.md''',
]
regexes = [
  '''secret,\s+prohibited/missing''',
]

[[allowlists]]
description = "NestJS scaffold placeholder CircleCI badge token in apps/api/README.md; known third-party placeholder, never a real secret."
paths = [
  '''apps/api/README\.md''',
]
regexes = [
  '''token=abc123def456''',
]